services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xxmz-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marxism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marxism_pass}
      POSTGRES_DB: ${POSTGRES_DB:-marxism_learning}
    # 只绑回环：这些中间件带默认弱口令，绝不能直接暴露到公网
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marxism} -d ${POSTGRES_DB:-marxism_learning}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xxmz-redis
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: xxmz-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/marxism_pass}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "127.0.0.1:7474:7474"   # browser
      - "127.0.0.1:7687:7687"   # bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: xxmz-app
    env_file: backend/.env
    environment:
      # 容器内连其他服务用服务名，覆盖 .env 的 localhost
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marxism}:${POSTGRES_PASSWORD:-marxism_pass}@postgres:5432/${POSTGRES_DB:-marxism_learning}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URL: bolt://neo4j:7687
      AUTO_CREATE_TABLES: "1"
    # 后端所有 /api/* 不做身份校验（user_id 由调用方自报），
    # 因此默认只绑回环；确实要给局域网访问时再显式改成 "8190:8190"。
    ports: ["127.0.0.1:8190:8190"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      neo4j: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
