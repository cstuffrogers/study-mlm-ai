# 精简版：App 已全本地化，后端默认只挂 TTS（/api/tts/speak），无需 PG/pgvector/Neo4j/Redis。
#
# 原先 compose 会拉起 postgres / redis / neo4j 三个中间件，服务于学习域
# 服务端模式（对话 / 题库 / 掌握度 / 知识图谱等 12 个路由）。现在这些路由已
# 移入 backend/api/legacy（LEGACY_ROUTERS=1 才挂载），App 端由 LocalRouter
# 本机分发，不再走后端。因此默认 compose 只跑一个 app，内存模式启动，
# 零数据库依赖，单容器即可提供 TTS。
#
# 若要临时启用学习域服务端模式（legacy 路由），需要先恢复下面三个服务，
# 并把 app 的 AUTO_CREATE_TABLES 改回 "1"、补回 DATABASE_URL / REDIS_URL /
# NEO4J_URL 与 depends_on。

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: xxmz-app
    env_file: backend/.env
    environment:
      # 内存模式：不建表、不连任何数据库；后端仅挂 TTS 路由
      AUTO_CREATE_TABLES: "0"
      LEARNING_DB_MODE: "memory"
      # 后端所有 /api/* 不做身份校验（user_id 由调用方自报），
      # 因此默认只绑回环；确实要给局域网访问时再显式改成 "8190:8190"。
    ports: ["127.0.0.1:8190:8190"]
    restart: unless-stopped
