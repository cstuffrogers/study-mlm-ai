# 只为把「可选/开发依赖」声明出来，方便编辑器补全、Pyright 解析、以及质量工具识别 ——
# 本项目不用 pip 安装自身（没有 build-backend），运行依赖仍以 requirements.txt 为准。
#
#   pip install -r backend/requirements-dev.txt     ← 实际安装命令（两者内容保持同步）
[project]
name = "xxmz-backend"
version = "1.3.0"
description = "正统马哲深度学习系统 —— FastAPI 后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3.0",
    "redis>=5.0",
    "neo4j>=5.0",
    "pydantic>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "edge-tts>=7.3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "openai>=1.30",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "websockets>=12.0",
]
